interface:
  display_name: "Codex Image"
  short_description: "Saved-file image workflow for API-key mode, exact paths or sizes, default Images API, and explicit Responses fallback"
  icon_small: "./assets/codex-image.svg"
  icon_large: "./assets/codex-image.svg"
  default_prompt: "Use $codex-image for saved-file work in API-key mode, custom `OPENAI_BASE_URL`, exact paths/sizes, PNG/JPEG/WebP, batch, or when `image_gen` is unavailable/failed. Prefer built-in `imagegen` for normal: current-turn image context, fast generate/edit, multi-turn without local file control. Launcher: POSIX `bash \"${CODEX_HOME:-$HOME/.codex}/skills/codex-image/scripts/codex-image\" ...` or Windows `%CODEX_HOME%\\skills\\codex-image\\scripts\\codex-image.cmd ...`. Default Images API; `--transport responses` only for prior-response state. For `edit` pass `--image PATH --prompt \"...\"` without `--size`; CLI auto-picks size + post-resizes to input dims. Don't pre-read dims. Non-ASCII via `--prompt`; use `--prompt-stdin`/`--prompt-file` when prompt has ASCII `\"` or `'` (cmd.exe splits on those). No `--input-fidelity` on `gpt-image-2` (no-op). `[Image #N]`, `[Turn -K]`, `[Thread Image #N]`, `[Last Output]`, `--image-set` are thread-only explicit local references, not native built-in image context."

policy:
  allow_implicit_invocation: true
