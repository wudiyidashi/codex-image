interface:
  display_name: "Codex Image"
  short_description: "Saved-file image workflow for API-key mode, exact paths or sizes, default Images API, and explicit Responses fallback"
  icon_small: "./assets/codex-image.svg"
  icon_large: "./assets/codex-image.svg"
  default_prompt: "Use $codex-image for saved-file work in API-key mode, custom `OPENAI_BASE_URL`, exact paths/sizes, PNG/JPEG/WebP, batch jobs, or when `image_gen` is hidden/unavailable/failed. Prefer built-in `imagegen` for the normal path: current-turn image context, fastest generate/edit, multi-turn follow-up without local file control. Launcher: POSIX `bash \"${CODEX_HOME:-$HOME/.codex}/skills/codex-image/scripts/codex-image\" ...` or Windows `%CODEX_HOME%\\skills\\codex-image\\scripts\\codex-image.cmd ...`. Default transport: Images API; use `--transport responses` only for prior-response state. For `edit` CLI auto-picks `--size` from the input when `--size` is omitted; or run `codex-image inspect FILE` first. Pass non-ASCII prompts directly via `--prompt`; don't preemptively write temp prompt files. Do not silently add `--input-fidelity` (no-op on `gpt-image-2`). `[Image #N]`, `[Turn -K]`, `[Thread Image #N]`, `[Last Output]`, `--image-set` are thread-only explicit local references, not native built-in image context."

policy:
  allow_implicit_invocation: true
